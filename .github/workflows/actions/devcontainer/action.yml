name: devcontainer
author: Vladimir Silyaev
description: Setup devcontainer on ubuntu GitHub runner
inputs:
  name:
    description: "Name of container saved in the repository, default 'devcontainer'"
    required: false
    default: 'devcontainer'
  variant:
    description: 'Extra tag appended to the image name (e.g. an OCaml version); empty string omits it'
    required: false
    default: ''
  platform:
    description: 'Target platform for the build (e.g. linux/amd64, linux/i386, linux/arm64, linux/arm/v7); empty means native'
    required: false
    default: ''
  config:
    description: 'Path to devcontainer.json (optional, defaults to .devcontainer/devcontainer.json)'
    required: false
    default: ''
  registry:
    description: 'Server address of Docker registry. If not set then will default to Docker Hub'
    required: false
    default: 'ghcr.io'
  username:
    description: 'Username used to log against the Docker registry'
    required: true
  password:
    description: 'Password or personal access token used to log against the Docker registry'
    required: true

outputs:
  exec:
    description: 'prefix that should be inserted to run commands in the container'
    value: ${{ steps.setup.outputs.exec }}

runs:
  using: "composite"
  steps:
    - name: devcontainer setup
      shell: bash
      id: setup
      run: |
        echo "::group::cache"
        npm install -g @devcontainers/cli
        PLATFORM='${{ inputs.platform }}'
        if [ -z "$PLATFORM" ]; then
          case "$(uname -m)" in
            aarch64|arm64) PLATFORM=linux/arm64 ;;
            armv7l|armv6l|arm) PLATFORM=linux/arm/v7 ;;
            i686|i386) PLATFORM=linux/386 ;;
            *) PLATFORM=linux/amd64 ;;
          esac
        fi
        export PLATFORM
        export DOCKER_DEFAULT_PLATFORM="$PLATFORM"
        ARCH=$(echo "$PLATFORM" | sed 's|linux/||; s|/||g')
        VARIANT='${{ inputs.variant }}'
        VARIANT_SUFFIX="${VARIANT:+-${VARIANT}}"
        IMAGE_ID=${{ inputs.registry }}/$GITHUB_REPOSITORY/${{ inputs.name }}${VARIANT_SUFFIX}-${ARCH}
        IMAGE_ID=$(echo $IMAGE_ID | tr '[A-Z]' '[a-z]')
        TAG="${GITHUB_BASE_REF:-${GITHUB_REF_NAME}}"
        TAG=$(echo $TAG | tr '[A-Z].' '[a-z]_')
        CONFIG_ARG=""
        if [ -n '${{ inputs.config }}' ]; then
          CONFIG_ARG="--config ${{ inputs.config }}"
        fi
        # Only the branch/tag being built pushes to $IMAGE_ID:$TAG, so on a
        # freshly created branch (and on tag builds, which never push) that
        # tag doesn't exist yet and the layer cache would be empty. The
        # default branch's tag is the best second chance; --cache-from can be
        # repeated, and importing a missing manifest is a warning, not an
        # error.
        DEFAULT_TAG=$(echo '${{ github.event.repository.default_branch }}' | tr '[A-Z].' '[a-z]_')
        CACHE_ARGS="--cache-from $IMAGE_ID:$TAG"
        if [ -n "$DEFAULT_TAG" -a "$DEFAULT_TAG" != "$TAG" ]; then
          CACHE_ARGS="$CACHE_ARGS --cache-from $IMAGE_ID:$DEFAULT_TAG"
        fi
        old_id=''
        if docker pull $IMAGE_ID:$TAG; then
          old_id=$(docker image inspect $IMAGE_ID:$TAG --format "{{.ID}}")
        fi
        echo "::group::build"
        env BUILDKIT_PROGRESS=plain devcontainer build --image-name $IMAGE_ID $CACHE_ARGS --platform "$PLATFORM" --workspace-folder . $CONFIG_ARG
        echo "::group::up"
        env BUILDKIT_PROGRESS=plain devcontainer up --workspace-folder . $CONFIG_ARG
        # PLATFORM is passed through to commands run via the exec prefix too
        # (e.g. `devcontainer exec ...`), so callers can act on the target
        # platform inside the container without re-deriving it from `uname`,
        # which is unreliable there for a non-native platform (a 32-bit
        # container on a 64-bit host still reports the host's machine type).
        echo "EXEC=devcontainer exec --remote-env PLATFORM=$PLATFORM --workspace-folder . $CONFIG_ARG" >> $GITHUB_OUTPUT
        if [ -n '${{ inputs.password }}' -a -z "${GITHUB_BASE_REF:-}" ]; then
          echo "::group::push"
          new_id=$(docker image inspect $IMAGE_ID --format "{{.ID}}")
          if docker tag $IMAGE_ID $IMAGE_ID:$TAG ; then
            if [ "$old_id" != "$new_id" ]; then
              username='${{ inputs.username }}'
              echo '${{ inputs.password }}' | docker login ${{ inputs.registry }} -u ${username:-'${{ github.actor }}'} --password-stdin
              if docker push $IMAGE_ID:$TAG ; then
                echo "::info :: pushed $IMAGE_ID:$TAG"
              else
                echo "::warning :: can't push $IMAGE_ID:$TAG"
              fi
              docker logout ${{ inputs.registry }}
            fi
          fi
        fi
